<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login - SkillTwin AI</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="background"></div>

<div class="auth-container">

    <div class="auth-card glass-card">

        <div class="logo center">
            ✦ SkillTwin AI
        </div>

        <h1>
            Welcome Back
        </h1>

        <p>
            Continue your learning journey.
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST"
              action="{{ url_for('login') }}">

            <input
                type="email"
                name="email"
                placeholder="Email address"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                class="btn primary full">
                LOGIN
            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <h3>
            Create Account
        </h3>

        <form method="POST"
              action="{{ url_for('signup') }}">

            <input
                type="text"
                name="name"
                placeholder="Your name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                class="btn secondary full">
                CREATE ACCOUNT
            </button>

        </form>


        <div class="demo-login">

            <strong>Demo Student</strong>

            <p>
                student@example.com
            </p>

            <p>
                Password: student123
            </p>

        </div>

    </div>

</div>

</body>

</html>
