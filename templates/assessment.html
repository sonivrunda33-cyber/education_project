<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Assessment - SkillTwin AI</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="background"></div>


<nav class="navbar">

    <div class="logo">
        ✦ SkillTwin AI
    </div>

    <a href="{{ url_for('dashboard') }}">
        Dashboard
    </a>

</nav>


<main class="assessment-page">

    <div class="assessment-header">

        <div class="badge">
            AI SKILL ASSESSMENT
        </div>

        <h1>
            Discover Your Skill Profile
        </h1>

        <p>
            Answer honestly. SkillTwin AI will
            analyze your current knowledge.
        </p>

    </div>


    <div class="glass-card assessment-card">

        <div class="question-progress">

            <span id="questionNumber">
                Question 1 / 10
            </span>

            <div class="progress">

                <div
                    id="questionProgress"
                    class="progress-bar"
                    style="width:10%">
                </div>

            </div>

        </div>


        <div id="questionContainer">

        </div>


        <div class="assessment-actions">

            <button
                id="nextBtn"
                class="btn primary">
                NEXT →
            </button>

        </div>

    </div>


    <div
        id="resultContainer"
        class="glass-card result-card hidden">

    </div>

</main>


<script src="{{ url_for(
    'static',
    filename='js/assessment.js'
) }}"></script>

</body>

</html>
